; RadioSplit
; OutputDevice is a playback device name, or a unique piece of one.
; Names are listed in RadioSplit.log. Leave this empty to use the Windows default playback device.
Enable=1
MuteInGame=1
OutputDevice=
; 1 leaves that group on the game speakers. 0 sends it to RadioSplit.exe.
; CustomRadio is User Tracks in SA, and the MP3 player in III and Vice City.
; TalkRadio is Chatterbox FM, K-Chat, VCPR and WCTR.
CustomRadio=0
TalkRadio=1
