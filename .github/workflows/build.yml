name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath RadioSplit.asi, RadioSplit.exe, RadioSplit.ini, README.md -Destination dist
          Compress-Archive -Path dist\* -DestinationPath RadioSplit.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioSplit-windows-x86
          if-no-files-found: error
          path: |
            RadioSplit.asi
            RadioSplit.exe
            RadioSplit.ini
            RadioSplit.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RadioSplit ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            RadioSplit.asi
            RadioSplit.exe
            RadioSplit.ini
            RadioSplit.zip
