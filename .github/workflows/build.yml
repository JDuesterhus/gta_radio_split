name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath RadioSplit.asi, RadioSplit.exe, RadioSplit.ini, README.md -Destination dist
          Compress-Archive -Path dist\* -DestinationPath RadioSplit.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioSplit-windows-x86
          if-no-files-found: error
          path: RadioSplit.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RadioSplit ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            **GTA III, Vice City, and San Andreas radio in its own audio process.**

            Only the radio is split; guns, engines, speech, cutscenes, and the rest stay in the game mix.

            ### Install
            1. Install [Ultimate ASI Loader](https://github.com/ThirteenAG/Ultimate-ASI-Loader) in the game folder.
            2. Copy `RadioSplit.asi`, `RadioSplit.exe`, and `RadioSplit.ini` next to the game executable.
            3. Start the game. `RadioSplit.log` lists the playback devices.
            4. For OBS, follow [this video](https://www.youtube.com/watch?v=kAKzH7jpM_U).

            The zip contains the `.asi`, `.exe`, `.ini`, and the README. See the [README](https://github.com/JDuesterhus/gta_radio_split#readme) for supported versions, configuration, and troubleshooting.

            This build is for the classic 32-bit PC versions. No game files are included.
          files: RadioSplit.zip
