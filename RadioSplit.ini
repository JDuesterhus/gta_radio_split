; RadioSplit
; OutputDevice is a playback device name, or a unique piece of one.
; Names are listed in RadioSplit.log. Leave this empty to use the Windows default playback device.
Enable=1
MuteInGame=1
OutputDevice=
; 1 leaves that station on the game speakers. 0 sends it to RadioSplit.exe.
UserTracksInGame=0
WctrInGame=1
